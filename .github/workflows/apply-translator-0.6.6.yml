name: Apply translator 0.6.6 and build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translator branch
        uses: actions/checkout@v4
        with:
          ref: translator-fixes-0.6.6
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply translator overlay
        run: |
          test -f translator-0.6.6-overlay.zip
          unzip -o translator-0.6.6-overlay.zip
          chmod +x gradlew

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Commit applied translator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Apply manga translator 0.6.6"
            git push origin HEAD:translator-fixes-0.6.6
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-translator-0.6.6-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
